# Build capable (app/) from the committed sources and publish app/dist to GitHub Pages.
#
# Starts on a push to main that touches what the app is built from, on demand,
# and when refresh.yml or editor-merge.yml dispatches it: their GITHUB_TOKEN
# commits and merges do not start push workflows, but a dispatch does (review S2).
# Its own concurrency group: a refresh never holds up a deploy, and a newer
# queued deploy replaces an older queued one (each builds the commit it was
# started for; refresh.yml redeploys if Pages ends up behind main).
#
# app.json is compiled from the sources here, offline, before the build: the
# lesson files, content/seed/works.json, the seed and the committed book
# (everything the scheduled refresh fetched is carried). So the site always
# matches the lessons even if content/build/app.json is stale (review S9). The
# clock is the commit's time: an edited app is newer than readers' copies, an
# unchanged one keeps its time (review S10). Nothing here is committed.
#
# Hardening (review S15): pinned actions, no default permissions, no token on
# disk; npm ci and the tests run in a job that can only read; the job that holds
# pages/id-token permissions runs nothing but deploy-pages.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "content/**"
      - "contract/**"
      - "ingest/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Compile app.json from the sources
        run: node ingest/bin/refresh.mjs --offline --now "$(date -u -d "@$(git log -1 --format=%ct)" +%FT%TZ)"
      - name: Test and build the app
        run: cd app && npm ci && npm test && npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
