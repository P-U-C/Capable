# Check an editor pull request (docs/REFRESH.md; review S9, S16, S17).
#
# The editor never pushes to main. It pushes only new or changed lesson files
# (content/lessons/<slug>.json) and content/seed/works.json to a branch
# editor/<yyyymmdd-hhmm> of this repository and opens a pull request into main.
# This workflow checks that pull request with a token that can only read: it
# runs the pull request's content, so it may hold no write permission. If it
# passes, editor-merge.yml (which runs from main and never runs pull-request
# code) re-checks the paths with main's rules, squash-merges, and deploys.
#
# Any lesson that fails the contract fails this check, even though the deployed
# app would only leave it out (ingest's "dropped and counted" rule).
name: editor

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: editor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: startsWith(github.head_ref, 'editor/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2 # the test merge commit and its first parent, main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Only lesson files and content/seed/works.json change
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node ingest/bin/editor-check.mjs paths --branch "$HEAD_REF" --diff "HEAD^1..HEAD"
      - name: Every lesson file passes the contract (strict)
        run: node contract/validate-app.mjs --strict content/lessons/*.json
      - name: Contract and ingest tests
        run: node --test contract/test/*.test.mjs && node --test ingest/test/
      - name: The app compiles with every lesson file (none dropped)
        run: node ingest/bin/refresh.mjs --offline --strict-lessons --now "$(node -p 'require("./content/build/book.json").generatedAt')"
      - name: The compiled app passes the contract (strict)
        run: node contract/validate-app.mjs --strict content/build/app.json
      - name: Test and build the app
        run: cd app && npm ci && npm test && npm run build
