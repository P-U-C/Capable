# Keep capable current: every 30 minutes, read public Farcaster nodes, recompile
# content/build/book.json and content/build/app.json, and commit them only if
# they changed. This is the only job that commits content/build/ (review S9).
# Then, whatever the refresh did, dispatch deploy.yml if GitHub Pages is not
# serving main's head (a refresh commit, an editor merge, a failed deploy):
# deploys never wait for the next content change (review S2).
#
# Fails closed: if no node answers, or the book or app does not validate,
# ingest/bin/refresh.mjs exits non-zero, the job fails, and nothing is committed.
# It never records "0 submissions". The old web/ atlas is not built or deployed.
#
# Hardening (review S15): actions pinned by commit SHA; no default permissions;
# checkout does not keep the token on disk while network data is parsed; the
# token is handed only to the step that pushes.
name: refresh

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit content/build/ (the token is used by the push step only)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }} # the branch head: a queued run starts from the latest book.json
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Refresh content/build from public nodes
        run: node ingest/bin/refresh.mjs --now "$(date -u +%FT%TZ)"
      - name: Commit content/build/ if it changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -z "$(git status --porcelain -- content/build/)" ]; then
            echo "content/build unchanged: nothing to commit"
            exit 0
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config user.name "capable-refresh"
          git config user.email "capable-refresh@users.noreply.github.com"
          git add -- content/build/
          git commit -m "ingest: refresh content/build"
          # Editor merges touch only lessons and works.json, so a rebase onto them never conflicts.
          for attempt in 1 2 3; do
            git -c "http.https://github.com/.extraheader=$auth" pull --rebase origin "$GITHUB_REF_NAME"
            if git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "push failed three times" >&2
          exit 1

  deploy:
    # Runs after the refresh, even a failed one: Pages must not lag main because the nodes are down.
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # main's head
      deployments: read # what Pages serves
      actions: write # dispatch deploy.yml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Dispatch deploy.yml if Pages is behind main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ingest/bin/deploy-if-behind.mjs --ref "$GITHUB_REF_NAME" --workflow deploy.yml
